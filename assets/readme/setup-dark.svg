<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Set up afk in three steps: run the installer on your computer, it shows a QR code, scan it with the afk app on your phone."><title>Set up afk in three steps</title>
<rect x="30" y="20" width="260" height="260" rx="18" fill="#15171A" stroke="#2A2D31"/>
<circle cx="60" cy="50" r="12" fill="none" stroke="#444950"/>
<text x="60" y="54.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#FFFFFF">1</text>
<text x="82" y="49" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Install the hub</text>
<text x="82" y="67" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A8ABB0">on your computer</text>
<rect x="320" y="20" width="260" height="260" rx="18" fill="#15171A" stroke="#2A2D31"/>
<circle cx="350" cy="50" r="12" fill="none" stroke="#444950"/>
<text x="350" y="54.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#FFFFFF">2</text>
<text x="372" y="49" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">It shows a QR code</text>
<text x="372" y="67" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A8ABB0">valid 15 minutes, one phone</text>
<rect x="610" y="20" width="260" height="260" rx="18" fill="#15171A" stroke="#2A2D31"/>
<circle cx="640" cy="50" r="12" fill="none" stroke="#444950"/>
<text x="640" y="54.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="500" fill="#FFFFFF">3</text>
<text x="662" y="49" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FFFFFF">Scan it with the app</text>
<text x="662" y="67" text-anchor="start" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#A8ABB0">and you're connected</text>
<rect x="50" y="96" width="220" height="150" rx="12" fill="#0B0C0D"/>
<circle cx="66" cy="112" r="4" fill="#444950"/>
<circle cx="80" cy="112" r="4" fill="#444950"/>
<circle cx="94" cy="112" r="4" fill="#444950"/>
<text x="64" y="142" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="400" fill="#E6E7E5">$ curl goafk.dev/install.sh | sh</text>
<text x="64" y="166" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#A8ABB0">✓ Zed found</text>
<text x="64" y="185" text-anchor="start" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#A8ABB0">✓ Agents synced</text>
